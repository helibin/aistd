name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # The generated API requires Go 1.23; offline verification cannot fetch a toolchain.
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: make setup
      - name: Check versions and changelogs in every new commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            BASE=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)
          fi
          node scripts/check-version.mjs --range "$BASE..HEAD"
      - run: make check
      - name: Offline generated-project verification
        run: make -C apps/cli verify
        env:
          TMPDIR: ${{ runner.temp }}
      - run: make build
